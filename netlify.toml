# Linky BAIC · sitio estático, sin paso de build.
[build]
  publish = "public"
  command = ""

# Seguridad. El servidor de pruebas (tests/server.mjs) lee estas mismas
# cabeceras de acá, así que lo que pasa en local es lo que pasa en Netlify.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), clipboard-write=(self)"
    X-Frame-Options = "DENY"
    X-Robots-Tag = "noindex, nofollow"

# Fuentes y librería de terceros no cambian: caché largo.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
